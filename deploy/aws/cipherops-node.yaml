AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CipherOps benchmark node: one Amazon Linux 2023 instance that runs both the offline benchmark and the simulated lab.
  Creates its own VPC, pulls the pinned images from a registry and serves the dashboard on the instance's localhost
  only; reach it with an SSM port-forward (see the Outputs). No inbound ports are open unless SSH is requested.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Node }
        Parameters: [InstanceType, VolumeSizeGiB, LatestAmiId]
      - Label: { default: Software }
        Parameters: [RepoUrl, RepoBranch, Registry, ComposeVersion]
      - Label: { default: "Network and access (optional SSH)" }
        Parameters: [VpcCidr, KeyName, SshCidr]

Parameters:
  InstanceType:
    Type: String
    Default: m7i.2xlarge
    AllowedPattern: ^[a-z][a-z0-9-]*\.[a-z0-9-]+$
    Description: >-
      x86_64 instance type (the images are amd64, so not Graviton). The offline harness needs at least 3 vCPUs; the
      simulated lab pins containers to cores 2-5 and wants 8 vCPU and 32 GiB RAM, which m7i.2xlarge gives. A cheaper
      option is c7i.2xlarge (8 vCPU, 16 GiB). For the cleanest offline timings use a bare-metal type (for example
      m7i.metal-24xl).
  VolumeSizeGiB:
    Type: Number
    Default: 100
    MinValue: 64
    MaxValue: 1000
    Description: Root volume (gp3, encrypted) for the images, results and packet captures.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 x86_64, resolved when the stack is created.
  RepoUrl:
    Type: String
    Default: https://github.com/aiori-hackathon/A3-PS036-TC161.git
    Description: Repository to deploy.
  RepoBranch:
    Type: String
    Default: main
    Description: Branch, tag or commit-ish to check out. It must contain deploy/aws/bootstrap.sh.
  Registry:
    Type: String
    Default: ghcr.io/hackchamp25
    Description: >-
      Registry namespace the pinned images are pulled from (must be public). The default is the team registry. The
      bootstrap pulls the latest offline image and the draft06 lab images.
  ComposeVersion:
    Type: String
    Default: v5.6.1
    AllowedPattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
    Description: Docker Compose release to install (Amazon Linux does not package it).
  VpcCidr:
    Type: String
    Default: 10.42.0.0/24
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/(1[6-9]|2[0-8])$
    Description: Address range of the VPC created for the node (one public subnet).
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair name, for SSH. Leave empty to use SSM Session Manager only.
  SshCidr:
    Type: String
    Default: ""
    AllowedPattern: ^$|^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$
    Description: >-
      Optional address range allowed to SSH to the node (for example 203.0.113.7/32). Empty opens no inbound port. The
      dashboard itself is never exposed: tunnel to it.

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]
  HasSsh: !And
    - !Condition HasKey
    - !Not [!Equals [!Ref SshCidr, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref VpcCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CipherOps node. No inbound rules unless SSH is requested; all outbound (image pulls, packages).
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-node" }]

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsh
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshCidr
      Description: SSH from the requested range

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # Session Manager: shell and port-forward, no SSH needed

  NodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref NodeRole]

  Node:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute          # the bootstrap needs outbound access
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT45M               # package installs and image pulls; a failed bootstrap fails the stack
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKey, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref NodeInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref NodeSecurityGroup]
      MetadataOptions:
        HttpTokens: required         # IMDSv2 only
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSizeGiB
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-node" }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > >(tee -a /var/log/cipherops-bootstrap.log) 2>&1
          set -x
          status=0
          dnf -y install git aws-cfn-bootstrap || status=$?
          if [ $status -eq 0 ]; then
            git clone --depth 1 --no-single-branch --branch ${RepoBranch} ${RepoUrl} /opt/cipherops || status=$?
          fi
          if [ $status -eq 0 ]; then
            REGISTRY=${Registry} COMPOSE_VERSION=${ComposeVersion} bash /opt/cipherops/deploy/aws/bootstrap.sh || status=$?
          fi
          /opt/aws/bin/cfn-signal -e $status --stack ${AWS::StackName} --resource Node --region ${AWS::Region}

Outputs:
  InstanceId:
    Description: The node.
    Value: !Ref Node
  PublicIp:
    Description: Public address (outbound only; no inbound port is open for the dashboard).
    Value: !GetAtt Node.PublicIp
  DashboardTunnel:
    Description: Run this on your machine (needs the AWS CLI and the Session Manager plugin), then open http://localhost:8501.
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${Node}
      --document-name AWS-StartPortForwardingSession
      --parameters '{"portNumber":["8501"],"localPortNumber":["8501"]}'
  Shell:
    Description: A shell on the node, and where the bootstrap log is.
    Value: !Sub "aws ssm start-session --region ${AWS::Region} --target ${Node}   # then: sudo tail /var/log/cipherops-bootstrap.log"
  SshTunnel:
    Condition: HasSsh
    Description: SSH alternative to the SSM tunnel.
    Value: !Sub "ssh -i <key.pem> -L 8501:127.0.0.1:8501 ec2-user@${Node.PublicIp}"
