[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipherops"
version = "0.1.0"
description = "Benchmark harness for the Verisign MTL mode reference implementation with SLH-DSA-SHA2-128s DNSSEC workloads"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["dnspython", "numpy", "pandas", "pyarrow", "PyYAML"]

[project.scripts]
cipherops = "cipherops.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["harness: requires the compiled C harness and reference library (run inside Docker)"]
